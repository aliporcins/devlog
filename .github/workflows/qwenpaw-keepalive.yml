name: QwenPaw keep-alive

# Keep the AgentScope free QwenPaw instance awake (it sleeps after 48h idle).
# The instance's access link requires a platform login (anonymous GET is 401),
# so this workflow logs in with Playwright and opens the app like a user.
# Secret required: AGENTSCOPE_PASSWORD (aliporcins@gmail.com platform password).

on:
  schedule:
    # 00:00 and 12:00 UTC = 08:00 and 20:00 CST, every day
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm i playwright
          npx playwright install --with-deps chromium
      - name: Visit QwenPaw (logged in)
        env:
          AGENTSCOPE_PASSWORD: ${{ secrets.AGENTSCOPE_PASSWORD }}
        run: node .github/workflows/qwenpaw-keepalive.mjs
