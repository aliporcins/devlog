name: Cleanup expired apps

# Every 3 days: re-check prices of apps posted in the last 7 days, remove
# any that are back to paid from the blog post + delete their Telegram
# messages, and delete blog posts older than 7 days.
on:
  schedule:
    - cron: "0 1 */3 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: report only, change nothing"
        required: false
        default: "false"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install Pillow
      - name: Run cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHANNEL_ID: "-1004423043910"
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python3 automation/cleanup.py $ARGS
      - name: Commit changes
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "free-apps-bot"
          git config user.email "free-apps-bot@users.noreply.github.com"
          git add posts/ assets/ automation/data/
          git diff --cached --quiet || git commit -m "cleanup expired free apps"
          git push
