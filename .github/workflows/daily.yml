name: Daily free apps

# Daily iOS free-apps pipeline: scrape sources, verify prices, write the blog
# post, deploy to Cloudflare Pages, post to the Telegram channel.
# Runs 09:00 CST (01:00 UTC). Manual runs support dry-run for testing.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD, default today)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: generate + build only, skip deploy and Telegram"
        required: false
        default: "false"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install Pillow
      - name: Install CJK font (cover images)
        # The cover title is Chinese; DejaVu has no CJK glyphs (boxes).
        # fonts-noto-cjk provides Noto Sans CJK SC for make_cover.
        # The check fails the run loudly if no CJK font is present
        # (a bare `ls | grep | head` would mask the failure: head exits 0).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          CJK_FILES=$(find /usr/share/fonts -iname "NotoSansCJKsc-*.otf" -o -iname "NotoSansCJK-*.ttc" | head -5)
          echo "$CJK_FILES"
          [ -n "$CJK_FILES" ] || { echo "ERROR: no Noto Sans CJK font found"; exit 1; }
      - name: Run pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHANNEL_ID: "-1004423043910"
        run: |
          ARGS=""
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python3 automation/pipeline.py $ARGS
      - name: Commit generated post + data
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "free-apps-bot"
          git config user.email "free-apps-bot@users.noreply.github.com"
          git add posts/ assets/ automation/data/
          git diff --cached --quiet || git commit -m "free apps ${{ inputs.date || 'today' }}"
          git push
