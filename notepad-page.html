<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>私密记事本 · 开发日志</title>
<meta name="description" content="仅站长可用的私密记事本：登录后查看与编辑笔记。">
<style>
:root{
  --bg:#05070a; --gold:#c9a962; --gold-hi:#e8cf9f; --gold-dim:rgba(201,169,106,.30);
  --warm:#f0ead9; --muted:#9aa294; --faint:#6d7466; --card-brd:rgba(201,169,106,.24);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color:var(--warm); min-height:100vh;
  background:linear-gradient(180deg,#0b0f16 0%, #070a10 42%, #05070a 78%, #04060a 100%);
  background-attachment:fixed;
}
a{color:inherit}
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:13px;
  padding:11px 22px;background:rgba(6,8,11,.62);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid var(--gold-dim);
}
.topbar .mark{
  width:38px;height:38px;border-radius:50%;flex:0 0 auto;
  border:1px solid var(--gold);box-shadow:0 0 16px rgba(201,169,106,.35);
  display:flex;align-items:center;justify-content:center;
  font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:19px;font-weight:700;color:var(--gold-hi);
  background:radial-gradient(circle at 35% 30%, rgba(232,207,159,.22), rgba(201,169,106,.05));
}
.topbar .t{
  font-family:"Songti SC","Noto Serif SC","STSong",serif;
  font-size:22px;font-weight:700;letter-spacing:.06em;white-space:nowrap;
  background:linear-gradient(180deg,#f4e3bb,#cfa963);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.topbar nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.topbar nav a{
  color:var(--muted);text-decoration:none;font-size:14px;letter-spacing:.06em;
  padding:7px 13px;border-radius:999px;border:1px solid transparent;
}
.topbar nav a:hover{color:var(--gold-hi)}
.wrap{max-width:780px;margin:0 auto;padding:0 22px}
@media (max-width:640px){ .wrap{padding:0 15px} .topbar .t{font-size:17px} }
h1{
  margin:38px 0 6px;font-family:"Songti SC","Noto Serif SC",serif;
  font-size:clamp(26px,4.4vw,34px);font-weight:700;letter-spacing:.03em;color:#fdf6e3;
}
.sub{color:var(--muted);font-size:14px;line-height:1.8}
.card{
  margin-top:22px;border-radius:18px;padding:22px;
  background:linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.024) 55%, rgba(201,169,106,.045));
  border:1px solid var(--card-brd);
  box-shadow:0 14px 34px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.09);
}
label{display:block;font-size:13px;letter-spacing:.12em;color:var(--gold);margin:14px 0 8px}
label:first-child{margin-top:0}
input[type="password"],input[type="text"],textarea{
  width:100%;font:inherit;font-size:15px;color:var(--warm);outline:none;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:11px 14px;
}
input:focus,textarea:focus{border-color:rgba(201,169,106,.6)}
textarea{min-height:260px;resize:vertical;line-height:1.8}
button{
  font:inherit;font-size:14px;cursor:pointer;color:#2a1e08;font-weight:650;
  background:linear-gradient(180deg,#ecd096,#c49a58);border:none;border-radius:999px;padding:10px 22px;
}
button.ghost{
  color:var(--gold-hi);font-weight:400;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.16);
}
button.danger{color:#ffd9d0;background:rgba(255,90,70,.12);border:1px solid rgba(255,90,70,.4);font-weight:400}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.row .sp{flex:1}
.msg{margin-top:14px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.msg.err{color:#ff9d8a}
.hidden{display:none !important}
.note{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);
  border-radius:14px;padding:14px 16px;margin-top:12px;color:var(--warm);
}
.note:hover{border-color:var(--gold-dim)}
.note .tt{font-size:16px;font-weight:650;color:#fdf6e3}
.note .sn{margin-top:6px;font-size:13.5px;line-height:1.7;color:var(--muted);white-space:pre-wrap;word-break:break-all}
.note .dt{margin-top:8px;font-size:12px;color:var(--faint)}
footer{max-width:780px;margin:0 auto;padding:34px 22px 46px;color:var(--faint);font-size:12.5px;line-height:1.9}
footer .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,106,.4),transparent);margin-bottom:16px}
</style>
</head>
<body>
<header class="topbar">
  <div class="mark">记</div>
  <div class="t">开发日志</div>
  <nav><a href="index.html">← 返回博客</a></nav>
</header>
<main class="wrap">
  <h1>私密记事本</h1>
  <p class="sub">仅站长可用：输入专用密码登录后查看与编辑笔记。本页不放在博客导航里；真正起作用的是服务端密码校验——密码只存在 Worker 密文里，不在页面代码中。</p>

  <!-- 登录视图 -->
  <section class="card" id="loginView">
    <form id="loginForm">
      <label for="pw">专用密码</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="输入记事本专用密码">
      <div class="row">
        <button type="submit" id="loginBtn">进入记事本</button>
      </div>
      <p class="msg" id="loginMsg"></p>
    </form>
  </section>

  <!-- 笔记视图 -->
  <section class="card hidden" id="notesView">
    <div class="row" style="margin-top:0">
      <button type="button" id="newBtn">＋ 新建一条</button>
      <span class="sp"></span>
      <button type="button" class="ghost" id="logoutBtn">退出登录</button>
    </div>
    <p class="msg" id="notesMsg"></p>
    <div id="notesList"></div>
  </section>

  <!-- 编辑视图 -->
  <section class="card hidden" id="editView">
    <label for="editTitle">标题</label>
    <input id="editTitle" type="text" placeholder="无标题也可以保存">
    <label for="editBody">正文</label>
    <textarea id="editBody" placeholder="写点什么……"></textarea>
    <div class="row">
      <button type="button" id="saveBtn">保存</button>
      <button type="button" class="ghost" id="cancelBtn">返回列表</button>
      <span class="sp"></span>
      <button type="button" class="danger hidden" id="deleteBtn">删除这条</button>
    </div>
    <p class="msg" id="editMsg"></p>
  </section>
</main>
<footer>
  <div class="rule"></div>
  私密记事本 · 会话有效期 30 天；退出登录会立即作废服务端会话。
</footer>
<script>
(function(){
  'use strict';
  // =====================================================================
  // 部署时必填：把下面这一行换成真实 Worker 地址。
  // 格式：https://notepad.hench.cc.cd（自定义域名，与博客同站，博客登录态可直通）
  // 这里只能是地址，绝不能写密码；密码只存在 Worker 的 NOTEPAD_PASSWORD 密文里。
  // 部署前若未替换，页面会直接提示“服务未配置”，不会静默失败。
  // =====================================================================
  var WORKER_URL = 'https://notepad.hench.cc.cd';
  var UNCONFIGURED = WORKER_URL.indexOf('REPLACE-WITH') !== -1;

  var loginView = document.getElementById('loginView');
  var notesView = document.getElementById('notesView');
  var editView = document.getElementById('editView');
  var loginForm = document.getElementById('loginForm');
  var pwInput = document.getElementById('pw');
  var loginMsg = document.getElementById('loginMsg');
  var notesMsg = document.getElementById('notesMsg');
  var notesList = document.getElementById('notesList');
  var editTitle = document.getElementById('editTitle');
  var editBody = document.getElementById('editBody');
  var editMsg = document.getElementById('editMsg');
  var deleteBtn = document.getElementById('deleteBtn');
  var editingId = null;

  function show(view){
    loginView.classList.add('hidden');
    notesView.classList.add('hidden');
    editView.classList.add('hidden');
    view.classList.remove('hidden');
  }
  function setMsg(el, text, isErr){
    el.textContent = text || '';
    el.classList.toggle('err', !!isErr);
  }
  function fmtTime(ts){
    try {
      return new Date(ts * 1000).toLocaleString('zh-CN', { hour12: false });
    } catch (e) { return ''; }
  }
  async function api(path, opts){
    opts = opts || {};
    var res = await fetch(WORKER_URL + path, {
      method: opts.method || 'GET',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    });
    var data = null;
    try { data = await res.json(); } catch (e) { /* 空响应 */ }
    return { status: res.status, data: data };
  }

  async function loadNotes(){
    setMsg(notesMsg, '加载中……');
    try {
      var r = await api('/api/notes');
      if (r.status === 401) { show(loginView); setMsg(loginMsg, '请先登录。'); return; }
      if (r.status !== 200) { setMsg(notesMsg, '加载失败，请稍后重试。', true); show(notesView); return; }
      renderList(r.data.notes || []);
      setMsg(notesMsg, (r.data.notes || []).length ? '' : '还没有笔记，点“新建一条”开始写。');
      show(notesView);
    } catch (e) {
      setMsg(notesMsg, '网络错误：连不上记事本服务，请检查 Worker 是否已部署。', true);
      show(notesView);
    }
  }

  function renderList(notes){
    notesList.textContent = '';
    notes.forEach(function(n){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'note';
      var tt = document.createElement('div');
      tt.className = 'tt';
      tt.textContent = n.title || '（无标题）';
      var sn = document.createElement('div');
      sn.className = 'sn';
      sn.textContent = (n.body || '').slice(0, 120);
      var dt = document.createElement('div');
      dt.className = 'dt';
      dt.textContent = fmtTime(n.updated_at);
      b.appendChild(tt);
      b.appendChild(sn);
      b.appendChild(dt);
      b.addEventListener('click', function(){ openEditor(n); });
      notesList.appendChild(b);
    });
  }

  function openEditor(note){
    editingId = note ? note.id : null;
    editTitle.value = note ? (note.title || '') : '';
    editBody.value = note ? (note.body || '') : '';
    deleteBtn.classList.toggle('hidden', !note);
    setMsg(editMsg, '');
    show(editView);
    editTitle.focus();
  }

  loginForm.addEventListener('submit', async function(ev){
    ev.preventDefault();
    var pw = pwInput.value;
    pwInput.value = ''; // 密码用完即清，不留在页面里
    if (!pw) { setMsg(loginMsg, '请先输入密码。', true); return; }
    setMsg(loginMsg, '登录中……');
    try {
      var r = await api('/api/login', { method: 'POST', body: { password: pw } });
      if (r.status === 200) { setMsg(loginMsg, ''); loadNotes(); return; }
      setMsg(loginMsg, '密码不对，或记事本密文尚未配置。', true);
    } catch (e) {
      setMsg(loginMsg, '网络错误：连不上记事本服务。', true);
    }
  });

  document.getElementById('newBtn').addEventListener('click', function(){ openEditor(null); });
  document.getElementById('cancelBtn').addEventListener('click', function(){ loadNotes(); });
  document.getElementById('logoutBtn').addEventListener('click', async function(){
    try { await api('/api/logout', { method: 'POST' }); } catch (e) { /* 忽略 */ }
    setMsg(loginMsg, '已退出登录。');
    show(loginView);
  });
  document.getElementById('saveBtn').addEventListener('click', async function(){
    var payload = { title: editTitle.value, body: editBody.value };
    if (editingId !== null) payload.id = editingId;
    setMsg(editMsg, '保存中……');
    try {
      var r = await api('/api/notes', { method: 'POST', body: payload });
      if (r.status === 200) { loadNotes(); return; }
      if (r.status === 401) { show(loginView); setMsg(loginMsg, '会话已过期，请重新登录。', true); return; }
      setMsg(editMsg, '保存失败，请稍后重试。', true);
    } catch (e) {
      setMsg(editMsg, '网络错误，保存失败。', true);
    }
  });
  deleteBtn.addEventListener('click', async function(){
    if (editingId === null) return;
    if (!window.confirm('确定删除这条笔记吗？')) return;
    try {
      var r = await api('/api/notes/' + editingId, { method: 'DELETE' });
      if (r.status === 200) { loadNotes(); return; }
      if (r.status === 401) { show(loginView); setMsg(loginMsg, '会话已过期，请重新登录。', true); return; }
      setMsg(editMsg, '删除失败，请稍后重试。', true);
    } catch (e) {
      setMsg(editMsg, '网络错误，删除失败。', true);
    }
  });

  // 启动：未配置 Worker 地址时直接明说，不发请求。
  if (UNCONFIGURED) {
    setMsg(loginMsg, '记事本服务未配置：部署时需把页面里的 Worker 地址换成真实地址。', true);
    document.getElementById('loginForm').querySelector('button').disabled = true;
    show(loginView);
  } else {
    loadNotes();
  }
})();
</script>
</body>
</html>
